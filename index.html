<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Creative designer and WordPress website designer portfolio.">
  <meta name="theme-color" content="#111111">
  <title>Designer Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="site-loader" id="siteLoader"><span></span></div>

  <header class="header" id="header">
    <a class="logo" href="#home" data-content="brand.name">Your Name<span>.</span></a>
    <nav class="nav" id="nav">
      <a href="#work">Work</a>
      <a href="#about">About</a>
      <a href="#services">Services</a>
      <a href="#contact">Contact</a>
    </nav>
    <a class="header-cta" href="#contact">Let's talk <span>↗</span></a>
    <button class="menu-btn" id="menuBtn" aria-label="Open menu"><span></span><span></span></button>
  </header>

  <main>
    <section class="hero section" id="home">
      <div class="hero-copy">
        <p class="eyebrow" data-content="hero.eyebrow"></p>
        <h1 data-html="hero.title"></h1>
        <p class="hero-description" data-content="hero.description"></p>
        <div class="hero-actions">
          <a class="button button-dark" href="#work">Explore my work <span>↗</span></a>
          <a class="text-link" href="#contact">Start a project <span>↗</span></a>
        </div>
      </div>
      <div class="hero-visual">
        <div class="hero-image-wrap">
          <img id="heroImage" alt="">
        </div>
        <div class="hero-note">
          <span class="dot"></span>
          <span data-content="hero.note"></span>
        </div>
      </div>
    </section>

    <section class="marquee" aria-label="Services">
      <div class="marquee-track" id="marqueeTrack"></div>
    </section>

    <section class="section work-section" id="work">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Selected work</p>
          <h2>Projects with a <em>purpose.</em></h2>
        </div>
        <p class="section-intro" data-content="work.intro"></p>
      </div>

      <div class="filter-bar" id="filterBar"></div>
      <div class="projects-grid" id="projectsGrid"></div>
    </section>

    <section class="section about-section" id="about">
      <div class="about-grid">
        <div class="about-statement">
          <p class="eyebrow">About me</p>
          <h2 data-html="about.title"></h2>
        </div>
        <div class="about-copy">
          <p data-content="about.paragraph1"></p>
          <p data-content="about.paragraph2"></p>
          <div class="stats" id="stats"></div>
        </div>
      </div>
    </section>

    <section class="section services-section" id="services">
      <div class="section-heading">
        <div>
          <p class="eyebrow">What I do</p>
          <h2>From idea to <em>experience.</em></h2>
        </div>
      </div>
      <div class="services-grid" id="servicesGrid"></div>
    </section>

    <section class="section process-section">
      <div class="section-heading">
        <div>
          <p class="eyebrow">My process</p>
          <h2>Simple. Strategic. <em>Thoughtful.</em></h2>
        </div>
      </div>
      <div class="process-grid" id="processGrid"></div>
    </section>

    <section class="section contact-section" id="contact">
      <div class="contact-inner">
        <p class="eyebrow">Have a project?</p>
        <h2 data-html="contact.title"></h2>
        <p data-content="contact.description"></p>
        <a class="contact-email" id="contactEmail" href="#"></a>
        <div class="contact-meta">
          <span data-content="contact.location"></span>
          <span data-content="contact.availability"></span>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <span data-content="brand.name"></span>
    <span data-content="footer.copyright"></span>
    <a href="#home">Back to top ↑</a>
  </footer>

  <div class="project-modal" id="projectModal" aria-hidden="true">
    <button class="modal-close" id="modalClose" aria-label="Close project">×</button>
    <div class="modal-content">
      <div class="modal-image"><img id="modalImage" alt=""></div>
      <div class="modal-copy">
        <p class="eyebrow" id="modalCategory"></p>
        <h2 id="modalTitle"></h2>
        <p id="modalDescription"></p>
        <div class="modal-details" id="modalDetails"></div>
        <a class="button button-dark" id="modalLink" href="#" target="_blank" rel="noopener">View project ↗</a>
      </div>
    </div>
  </div>

  <script src="js/content.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
